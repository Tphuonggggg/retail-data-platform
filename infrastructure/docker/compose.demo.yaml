name: retail-portfolio-demo
services:
  postgres:
    image: postgres:18
    environment:
      POSTGRES_DB: retail_portfolio_demo
      POSTGRES_USER: portfolio_demo
      POSTGRES_PASSWORD: ${RETAIL_DEMO_PASSWORD:?Use python -m ingestion.demo}
    ports:
      - '127.0.0.1:55439:5432'
    tmpfs:
      - /var/lib/postgresql
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U portfolio_demo -d retail_portfolio_demo']
      interval: 2s
      timeout: 2s
      retries: 30
    restart: 'no'
